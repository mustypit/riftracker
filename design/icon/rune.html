<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const q = new URLSearchParams(location.search);
const SIZE = +(q.get('size') || 1024), BG = q.get('bg') || 'teal', CORE = q.get('core') || '#19C2B4';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// Background: a soft radial gradient drawn into a texture.
const bgc = document.createElement('canvas'); bgc.width = bgc.height = 512;
const g = bgc.getContext('2d'), grd = g.createRadialGradient(256, 230, 10, 256, 256, 380);
const bgs = { teal: ['#1A5A63', '#06171C'], navy: ['#22305A', '#070A14'], black: ['#2A2C30', '#0B0C0E'] }[BG];
grd.addColorStop(0, bgs[0]); grd.addColorStop(1, bgs[1]); g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
const bgTex = new THREE.CanvasTexture(bgc); bgTex.colorSpace = THREE.SRGBColorSpace; scene.background = bgTex;
const pm = new THREE.PMREMGenerator(renderer);

// Studio: dark room with a few softboxes, so gold gets crisp bright and dark facets.
const studio = new THREE.Scene(); studio.background = new THREE.Color('#1c1a17');
const box = (w, h, x, y, z, c, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m); };
box(6, 2.2, -4, 5, 6, '#FFF4E0', 5);   // big key, top left
box(1.2, 8, 7, 0, 3, '#FFFFFF', 3);    // strip, right
box(8, 1, 0, -6, 4, '#FFE2B0', 1.6);   // floor bounce
box(3, 3, 0, 2, -8, '#9FE9FF', 1.2);   // cool back light
box(10, 10, 0, 12, 0, '#3A3A3A', 1);   // ceiling
box(7, 5, 1.5, 1, 9, '#FFE9C4', 2.2);   // soft front fill
box(4, 4, -7, -1, 2, '#FFE7BD', 2.5);  // left
box(5, 2, 4, 6, 3, '#FFFFFF', 3);      // top right
scene.environment = pm.fromScene(studio, 0.02).texture;

const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 6.82), 1, 0.1, 200); cam.position.set(0, 0, 35);

// Geometry: a diamond-shaped rune. Outer rim -> raised bevel ridge -> recessed window holding a crystal.
const W = 1.0, H = 1.42;
const dia = (s, z) => [[0, H * s, z], [W * s, 0, z], [0, -H * s, z], [-W * s, 0, z]];
const O = dia(1, 0), OB = dia(1, -0.34), BK = dia(0.96, -0.42), I = dia(0.48, 0.5), J = dia(0.4, 0.24);
const pos = [];
const tri = (a, b, c) => pos.push(...a, ...c, ...b);
const quad = (a, b, c, d) => { tri(a, b, c); tri(a, c, d); };
for (let i = 0; i < 4; i++) {
  const n = (i + 1) % 4;
  // front facets: split each sloped side in two along the ridge for more sparkle
  const m = O[i].map((v, k) => (v + O[n][k]) / 2); const mi = I[i].map((v, k) => (v + I[n][k]) / 2);
  m[2] = 0.1; mi[2] = 0.53;
  quad(O[i], m, mi, I[i]); quad(m, O[n], I[n], mi);
  quad(I[n], J[n], J[i], I[i]);           // inner wall into the window
  quad(O[n], O[i], OB[i], OB[n]);          // outer side
  quad(OB[n], OB[i], BK[i], BK[n]);        // back chamfer
}
tri(BK[0], BK[2], BK[1]); tri(BK[0], BK[3], BK[2]);
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.computeVertexNormals();
const gold = new THREE.MeshPhysicalMaterial({ color: '#F2B544', metalness: 1, roughness: 0.3, clearcoat: 0.4, clearcoatRoughness: 0.08, envMapIntensity: 1.8, side: THREE.DoubleSide });
const rune = new THREE.Group(); rune.add(new THREE.Mesh(geo, gold));
// window floor
const fl = new THREE.BufferGeometry(); fl.setAttribute('position', new THREE.Float32BufferAttribute([...J[0], ...J[3], ...J[2], ...J[0], ...J[2], ...J[1]], 3)); fl.computeVertexNormals();
rune.add(new THREE.Mesh(fl, new THREE.MeshStandardMaterial({ color: '#06110F', roughness: .6 })));
// crystal: a faceted diamond pyramid in the window
const C = dia(0.36, 0.25), apex = [0, 0, 0.66], cp = [];
for (let i = 0; i < 4; i++) { const n = (i + 1) % 4; const m = C[i].map((v, k) => (v + C[n][k]) / 2); m[2] = 0.36; const a2 = [m[0] * .35, m[1] * .35, 0.55];
  cp.push(...C[i], ...a2, ...m, ...m, ...a2, ...C[n], ...C[i], ...apex, ...a2, ...a2, ...apex, ...C[n]); }
const cg = new THREE.BufferGeometry(); cg.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3)); cg.computeVertexNormals();
const crystal = new THREE.MeshPhysicalMaterial({ color: CORE, emissive: CORE, emissiveIntensity: 0.45, metalness: 0.1, roughness: 0.08, clearcoat: 1, envMapIntensity: 1.6, flatShading: true });
rune.add(new THREE.Mesh(cg, crystal));
const glow = new THREE.PointLight(CORE, 3, 1.6); glow.position.set(0, 0, 0.7); rune.add(glow);
scene.add(rune);
// Wireframe modes: wire=1 lines only (hidden lines faint), wire=2 lines over the render.
const WIRE = +(q.get('wire') || 0);
if (WIRE) {
  const meshes = rune.children.filter(o => o.isMesh);
  for (const m of meshes) {
    const fat = (g, color, width, opacity) => { const lg = new LineSegmentsGeometry().setPositions(g.attributes.position.array);
      const mat = new LineMaterial({ color, linewidth: width * SIZE / 1024, transparent: true, opacity, depthTest: WIRE !== 1 }); mat.resolution.set(SIZE, SIZE);
      return new LineSegments2(lg, mat); };
    const tri = fat(new THREE.WireframeGeometry(m.geometry), '#6FA8FF', 1.2, WIRE === 1 ? .45 : .5);
    const edges = fat(new THREE.EdgesGeometry(m.geometry, 1), m.material === crystal ? '#5CF2E4' : (WIRE === 1 ? '#FFD27A' : '#FFF3D0'), WIRE === 1 ? 2.6 : 2, 1);
    rune.add(tri, edges);
    if (WIRE === 1) m.visible = false;
  }
  if (WIRE === 1) glow.intensity = 0;
}

const key = new THREE.DirectionalLight('#FFF1D6', 1.2); key.position.set(-3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight('#8FE8FF', 0.8); rim.position.set(4, -2, 2); scene.add(rim);

const comp = new EffectComposer(renderer);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(SIZE, SIZE), 0.35, 0.4, 0.9));
comp.addPass(new OutputPass());
rune.scale.z = +(q.get('depth') || 1);
window.draw = (ry = -0.32, rx = 0.16) => { rune.rotation.set(rx, ry, 0); comp.render(); return true; };
window.ready = true;
</script>
