name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the fixed signing key so updates install over old versions
        # Optional for now. The keystore goes in the SIGNING_KEYSTORE repository secret (base64 of a
        # debug keystore, alias androiddebugkey, password android); never commit it. Without it the
        # APK is signed with a throwaway key, so each build installs only after uninstalling the last.
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::warning::No SIGNING_KEYSTORE secret: this APK won't install over earlier builds."
          else
            mkdir -p ~/.android
            echo "$SIGNING_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Tests and screenshots
        # Every JVM test (logic, database, UI on Robolectric) plus a screenshot of each screen.
        run: ./gradlew recordRoborazziDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/screenshots/
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK after the build
        run: cp app/build/outputs/apk/debug/app-debug.apk rifttracker-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rifttracker-apk
          path: rifttracker-${{ github.run_number }}.apk
